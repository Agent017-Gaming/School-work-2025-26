<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Library</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <h2>📚 La mia biblioteca 📚</h2>
  <form id="register" onsubmit="return false">
    <label>ID:</label>
    <input type="number" id="inputId" min="0" placeholder="Give me an iD, pls...." required>
    <label>Year:</label>
    <input type="number" id="inputYr" min="1850" placeholder="Give me a year, pls...."required>
    <label>Title:</label>
    <input type="text" id="inputTitle" placeholder="Give me a title, pls...." required>
    <label>Author:</label>
    <input type="text" id="inputAuthor" placeholder="Give me an Authors...."required>
    <button id="submit" onclick="addBook()">Submit</button>
  </form>
  <br>
  <p>
    <input type="text" id="filterInput" placeholder="Search By Title" oninput="filter()">
  </p>
  <table id="table">
    <thead>
      <tr>
        <th>ID</th>
        <th>Author</th>
        <th>Title</th>
        <th>Actions</th>
      </tr>
    </thead>
    <tbody id="tbody">

    </tbody>
  </table>

  <script type="module" src="script.js"></script>
</body>

</html>
